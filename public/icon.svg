<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Background glowing ambient orb -->
  <circle cx="256" cy="220" r="140" fill="url(#gemGrad)" opacity="0.18" filter="url(#glow)" />

  <!-- Wallet / Card Shape -->
  <rect x="96" y="150" width="320" height="220" rx="32" fill="#1e293b" stroke="url(#gemGrad)" stroke-width="6" />
  
  <!-- Card Header Strip -->
  <path d="M 96 210 L 416 210" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Currency Emblem (₹ / $) -->
  <text x="180" y="300" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="76" fill="url(#gemGrad)" text-anchor="middle">₹</text>

  <!-- Card Chip / Flap -->
  <rect x="300" y="228" width="86" height="64" rx="16" fill="url(#gemGrad)" />
  <circle cx="343" cy="260" r="12" fill="#0f172a" />

  <!-- Checkmark Badge for TO-DO / Daily Work -->
  <circle cx="376" cy="376" r="62" fill="url(#accentGrad)" stroke="#0f172a" stroke-width="8" filter="url(#glow)" />
  <path d="M 352 376 L 368 392 L 402 358" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
